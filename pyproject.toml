[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-logo-switch"
version = "0.1.0"
description = "Turn a PNG into a native pixel-art welcome icon for Claude Code."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "ArthurYangX"}]
dependencies = ["Pillow>=10,<14"]

[project.scripts]
cc-logo-switch = "png_to_claude_code.cli:main"
claude-logo-switch = "png_to_claude_code.cli:main"
png-to-claude = "png_to_claude_code.cli:main"

[project.urls]
Repository = "https://github.com/ArthurYangX/cc-logo-switch"

[tool.setuptools.packages.find]
where = ["src"]
